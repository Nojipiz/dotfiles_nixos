# Noctalia v5 configuration
# Docs: https://docs.noctalia.dev/noctalia/configuration/

[theme]
mode = "dark"
source = "custom"
custom_palette = "nord"

[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[accessibility]
ui_scale = 1.0

[shell]
font_family = "Fira Code"
lang = ""
corner_radius_scale = 1.0
clipboard_enabled = true
launch_apps_as_systemd_services = false

[shell.animation]
enabled = false
speed = 1.0

[shell.shadow]
direction = "down_right"
alpha = 0.55

[shell.screen_corners]
enabled = false

[shell.panel]
transparency_mode = "solid"
launcher_placement = "attached"
clipboard_placement = "attached"
control_center_placement = "attached"
wallpaper_placement = "attached"
session_placement = "attached"
open_near_click_control_center = true

[shell.launcher]
categories = true
sort_by_usage = true
compact = false
app_grid = false
pinned = []

[shell.mpris]
blacklist = []

[shell.session]
show_shortcuts = true

[[shell.session.actions]]
action = "lock"
enabled = true
countdown_seconds = 10

[[shell.session.actions]]
action = "suspend"
enabled = true
countdown_seconds = 10

[[shell.session.actions]]
action = "command"
label = "Hibernate"
command = "systemctl hibernate"
enabled = true
countdown_seconds = 10

[[shell.session.actions]]
action = "reboot"
enabled = true
countdown_seconds = 10

[[shell.session.actions]]
action = "logout"
enabled = true
countdown_seconds = 10

[[shell.session.actions]]
action = "shutdown"
enabled = true
countdown_seconds = 10

[lockscreen]
enabled = true
lock_before_suspend = true

[bar.default]
position = "top"
enabled = true
reserve_space = true
background_opacity = 0.93
border_width = 0.0
font_scale = 1.1
capsule = true
capsule_opacity = 1.0
margin_ends = 0
start = ["launcher-toggle", "workspaces", "sysmon", "active_window", "media"]
center = ["clock"]
end = ["tray", "network", "notifications", "battery", "volume", "brightness", "control-center"]

[widget.launcher-toggle]
type = "custom_button"
glyph = "rocket"

[widget.launcher-toggle.actions]
left = "panel-toggle launcher"

[widget.clock]
format = "{:%H:%M}"

[location]
auto_locate = false
address = "Bogota"
# The first day of the week follows the system locale (LC_TIME).

[weather]
enabled = false
unit = "metric"
effects = false

[calendar]
enabled = true

[control_center.calendar]
show_events_card = true
show_week_numbers = false

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "screen_recorder" # needs noctalia/screen_recorder (see [plugins])

[[control_center.shortcuts]]
type = "wallpaper"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[wallpaper]
enabled = true
directory = "~/Pictures/Wallpapers" # installed by default.nix
fill_mode = "crop"
fill_color = "#000000"
transition = ["fade"]
transition_duration = 500
edge_smoothness = 0.05
per_monitor_directories = false

[wallpaper.automation]
enabled = false
interval_seconds = 300
order = "random"
recursive = false

[wallpaper.default]
path = "~/Pictures/Wallpapers/base_wallpaper.png"

[backdrop]
enabled = false

[dock]
enabled = false
auto_hide = false
smart_auto_hide = false
reserve_space = true
background_opacity = 1.0
active_monitor_only = true
pinned = []

[notification]
enable_daemon = true
position = "top_right"
layer = "overlay"
background_opacity = 1.0
keep_dismissed_in_history = true

[osd]
enabled = true
position = "top_right"
background_opacity = 1.0

[osd.kinds]
keyboard_layout = true

[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5

[brightness]
enable_ddcutil = false
minimum_brightness = 0.05

[system.monitor]
enabled = true
cpu_poll_seconds = 3.0
gpu_poll_seconds = 3.0
memory_poll_seconds = 3.0
network_poll_seconds = 3.0
disk_poll_seconds = 3.0
cpu_usage_activity_threshold = 80
cpu_usage_critical_threshold = 90
cpu_temp_activity_threshold = 80
cpu_temp_critical_threshold = 90
gpu_usage_activity_threshold = 80
gpu_usage_critical_threshold = 90
ram_pct_activity_threshold = 80
ram_pct_critical_threshold = 90
disk_used_pct_activity_threshold = 80
disk_used_pct_critical_threshold = 90

[nightlight]
enabled = false
force = false
temperature_day = 6500
temperature_night = 4000

[plugins]
enabled = ["noctalia/screen_recorder"]
